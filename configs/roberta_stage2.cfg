# Stage 2 of 2: start from the stage-1 pipeline and fine-tune all of RoBERTa-base together with the
# softmax layer (a BIO token classifier), keeping the checkpoint with the best validation F1.
#   python -m spacy train configs/roberta_stage2.cfg --code pantrypal/spacy_scorer.py --output models/roberta
[paths]
train = "corpus/train.spacy"
dev = "corpus/val.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = "pytorch"
seed = 4641

[nlp]
lang = "en"
pipeline = ["transformer","bio_tagger"]
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
batch_size = 64
tokenizer = {"@tokenizers":"spacy.Tokenizer.v1"}
vectors = {"@vectors":"spacy.Vectors.v1"}

[components]

# Both components come from stage 1 (model-last, with the listener's grad_factor set back to 1 by
# scripts/unfreeze_stage1.py); all 12 transformer layers are now updated.
[components.transformer]
source = "models/roberta_stage1/model-unfrozen"

[components.bio_tagger]
source = "models/roberta_stage1/model-unfrozen"

[corpora]

# gold_preproc = true: train and score on the team tokenizer's tokens, exactly what predict.py
# feeds the model (false would re-tokenize the text with spaCy's English tokenizer)
[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
gold_preproc = true
max_length = 0
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
gold_preproc = true
max_length = 0
limit = 0
augmenter = null

[training]
train_corpus = "corpora.train"
dev_corpus = "corpora.dev"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
# about 100 steps per epoch on the full training split; evaluate on val about once per epoch
patience = 600
max_epochs = 6
max_steps = 0
eval_frequency = 50
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
size = 300
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 0.00000001

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
warmup_steps = 40
total_steps = 640
initial_rate = 0.00005

[training.score_weights]
ents_f = 1.0
ents_p = 0.0
ents_r = 0.0
tag_acc = 0.0

[pretraining]

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.tokenizer]
