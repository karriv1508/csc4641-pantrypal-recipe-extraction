# Stage 1 of 2: only the new softmax layer over the 25 BIO labels is trained, at a high learning
# rate, on top of RoBERTa-base (from spaCy's en_core_web_trf 3.8.0). The listener's grad_factor = 0
# passes no gradient to the transformer and L2 = 0, so its weights stay as pretrained. spaCy
# initializes the new layer to zero, so without this stage the transformer would receive almost no
# gradient during the first epoch of fine-tuning.
#   python -m spacy train configs/roberta_stage1.cfg --code pantrypal/spacy_scorer.py --output models/roberta_stage1
[paths]
train = "corpus/train.spacy"
dev = "corpus/val.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = "pytorch"
seed = 4641

[nlp]
lang = "en"
pipeline = ["transformer","bio_tagger"]
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
batch_size = 64
tokenizer = {"@tokenizers":"spacy.Tokenizer.v1"}
vectors = {"@vectors":"spacy.Vectors.v1"}

[components]

# Pretrained RoBERTa-base weights and byte-BPE tokenizer, copied from the installed package
# (no Hugging Face download needed). They are not changed in this stage.
[components.transformer]
source = "en_core_web_trf"

[components.bio_tagger]
factory = "tagger"
label_smoothing = 0.0
neg_prefix = "!"
overwrite = true
scorer = {"@scorers":"pantrypal.bio_scorer.v1"}

[components.bio_tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.bio_tagger.model.tok2vec]
@architectures = "spacy-curated-transformers.LastTransformerLayerListener.v1"
width = 768
upstream = "transformer"
pooling = {"@layers":"reduce_mean.v1"}
grad_factor = 0.0

[corpora]

# gold_preproc = true: train and score on the team tokenizer's tokens, exactly what predict.py
# feeds the model (false would re-tokenize the text with spaCy's English tokenizer)
[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
gold_preproc = true
max_length = 0
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
gold_preproc = true
max_length = 0
limit = 0
augmenter = null

[training]
train_corpus = "corpora.train"
dev_corpus = "corpora.dev"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
# about 100 steps per epoch on the full training split; stage 2 starts from model-last
patience = 400
max_epochs = 1
max_steps = 0
eval_frequency = 50
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
size = 300
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.0
grad_clip = 1.0
use_averages = false
eps = 0.00000001

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
warmup_steps = 10
total_steps = 110
initial_rate = 0.001

[training.score_weights]
ents_f = 1.0
ents_p = 0.0
ents_r = 0.0
tag_acc = 0.0

[pretraining]

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.tokenizer]
